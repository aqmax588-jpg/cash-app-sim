<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cash App · Login</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
body {
  background: #000;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
.box {
  width: 100%;
  max-width: 380px;
}
.logo {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: #00d54b;
  color: #000;
  font-size: 30px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 18px;
}
h2 {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
}
.subtitle {
  text-align: center;
  color: #8a8a8e;
  font-size: 14px;
  margin-bottom: 26px;
}
label {
  display: block;
  font-size: 13px;
  color: #8a8a8e;
  margin: 14px 0 6px;
}
input {
  width: 100%;
  padding: 15px 16px;
  border-radius: 12px;
  border: none;
  background: #1c1c1e;
  color: #fff;
  font-size: 16px;
  outline: none;
}
input::placeholder {
  color: #5a5a5e;
}
button {
  width: 100%;
  padding: 16px;
  margin-top: 22px;
  background: #00d54b;
  color: #000;
  border: none;
  border-radius: 12px;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
}
button:active {
  background: #00b840;
}
.msg {
  margin-top: 14px;
  text-align: center;
  font-size: 14px;
  min-height: 20px;
  color: #ff6b6b;
}
.admin-link {
  display: block;
  text-align: center;
  margin-top: 26px;
  color: #5a5a5e;
  font-size: 13px;
  text-decoration: none;
}
</style>
</head>
<body>
<div class="box">
  <div class="logo">$</div>
  <h2>Sign in to Cash App</h2>
  <div class="subtitle">Use the Cash ID created by admin</div>

  <label>Cash ID</label>
  <input id="uid" placeholder="e.g. rose" autocomplete="off">

  <label>Password</label>
  <input id="pwd" type="password" placeholder="Your password">

  <button onclick="login()">Sign In</button>
  <div class="msg" id="msg"></div>

  <a class="admin-link" href="/admin">Admin panel</a>
</div>

<script>
function newClientId() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

async function login() {
  const uid = document.getElementById('uid').value.trim();
  const pwd = document.getElementById('pwd').value.trim();
  const msgBox = document.getElementById('msg');
  msgBox.innerText = '';

  if (!uid || !pwd) {
    msgBox.innerText = 'Please enter Cash ID and password';
    return;
  }

  const clientId = newClientId();

  try {
    const res = await fetch('/api/user/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: uid, password: pwd, clientId: clientId })
    });
    const data = await res.json();

    if (!data.ok) {
      msgBox.innerText = data.msg || 'Login failed';
      return;
    }

    localStorage.setItem('uid', data.user.uid);
    localStorage.setItem('clientId', clientId);
    localStorage.setItem('userInfo', JSON.stringify(data.user));
    location.href = '/cash';
  } catch (e) {
    msgBox.innerText = 'Network error, please retry';
  }
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
