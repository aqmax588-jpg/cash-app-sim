<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>管理后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#111;color:#fff;padding:20px}
.container{max-width:900px;margin:0 auto}
h2{margin-bottom:16px}
.panel{background:#222;padding:16px;border-radius:12px;margin-bottom:16px}
input{padding:10px;margin:6px;border-radius:6px;border:none;width:calc(100% - 14px);background:#333;color:#fff}
button{padding:10px 16px;margin:6px;background:#00d54b;color:#000;border:none;border-radius:6px;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #444;padding:10px;text-align:left}
th{background:#333}
</style>
</head>
<body>
<div class="container">
  <div id="loginWrap">
    <h2>管理员登录</h2>
    <div class="panel">
      <input id="adminUser" placeholder="管理员账号">
      <input id="adminPwd" type="password" placeholder="密码">
      <button onclick="adminLogin()">登录后台</button>
      <div id="adminMsg"></div>
    </div>
  </div>
  <div id="mainWrap" style="display:none">
    <h2>管理控制台</h2>
    <div class="panel">
      <h3>新增用户账号</h3>
      <input id="newUid" placeholder="用户 ID">
      <input id="newPwd" placeholder="用户密码">
      <input id="newNick" placeholder="昵称">
      <input id="newAvatar" placeholder="头像链接">
      <button onclick="addUser()">添加账号</button>
      <div id="addMsg"></div>
    </div>
    <div class="panel">
      <h3>用户列表 & 修改余额</h3>
      <table id="userTable">
        <thead>
          <tr><th>用户ID</th><th>昵称</th><th>当前余额</th><th>设置余额</th></tr>
        </thead>
        <tbody id="userTbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
async function adminLogin(){
  const u = document.getElementById("adminUser").value.trim();
  const p = document.getElementById("adminPwd").value.trim();
  const res = await fetch("/api/admin/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u, password:p})
  });
  const d = await res.json();
  if(d.ok){
    document.getElementById("loginWrap").style.display = "none";
    document.getElementById("mainWrap").style.display = "block";
    loadUserList();
  }else{
    document.getElementById("adminMsg").innerText = "账号或密码错误";
  }
}
async function addUser(){
  const uid = document.getElementById("newUid").value.trim();
  const pwd = document.getElementById("newPwd").value.trim();
  const nick = document.getElementById("newNick").value.trim();
  const avatar = document.getElementById("newAvatar").value.trim();
  const r = await fetch("/api/admin/add-user", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({uid, password:pwd, nickname:nick, avatar})
  });
  const d = await r.json();
  document.getElementById("addMsg").innerText = d.msg;
  loadUserList();
}
async function loadUserList(){
  const res = await fetch("/api/admin/users");
  const users = await res.json();
  const tb = document.getElementById("userTbody");
  tb.innerHTML = "";
  users.forEach(u=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.uid}</td>
      <td>${u.nickname}</td>
      <td>$${u.balance.toLocaleString()}</td>
      <td><input type="number" id="bal-${u.uid}" value="${u.balance}">
      <button onclick="setBal('${u.uid}')">保存</button></td>
    `;
    tb.appendChild(tr);
  })
}
async function setBal(uid){
  const val = document.getElementById(`bal-${uid}`).value;
  await fetch("/api/admin/set-balance", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({uid, newBalance:val})
  });
  loadUserList();
}
</script>
</body>
</html>
