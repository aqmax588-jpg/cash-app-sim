<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00D54B">
<title>Cash App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
html,body{background:#0d0d0d;color:#fff;min-height:100vh;}
.wrap{max-width:600px;margin:0 auto;padding:18px;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.balance-card{background:#171717;border:1px solid #242424;border-radius:16px;padding:20px;margin-bottom:18px;}
.balance-card .label{font-size:13px;color:#aaa;}
.balance-card .val{font-size:26px;font-weight:700;margin-top:4px;}
.panel{background:#171717;border:1px solid #242424;border-radius:16px;padding:18px;margin-bottom:16px;}
.panel h2{font-size:15px;margin-bottom:12px;color:#eee;}
.field{margin-bottom:12px;}
.field input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff;font-size:14px;outline:none;}
.field input::placeholder{color:#555;}
button{padding:11px 16px;border:none;border-radius:10px;background:#00d54b;color:#000;font-weight:700;font-size:14px;cursor:pointer;}
button:active{background:#00b840;}
button.gray{background:#2a2a2a;color:#ddd;}
.user-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #242424;}
.avatar{width:40px;height:40px;border-radius:50%;background:#00d54b;color:#000;font-weight:bold;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.info{flex:1;}
.info .name{font-weight:600;font-size:14px;}
.info .id{font-size:12px;color:#888;}
.msg{font-size:13px;margin-top:8px;min-height:18px;}
.msg.err{color:#ff6b6b;}
.msg.ok{color:#00d54b;}
.logout{color:#ff6b6b;font-size:13px;cursor:pointer;}
.list-wrap{max-height:280px;overflow:auto;}
.record-row{padding:10px 0;border-bottom:1px solid #242424;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="loadingView">
    <div class="panel">
      <div>正在自动登录...</div>
    </div>
  </div>

  <div id="mainView" style="display:none;">
    <div class="header">
      <div></div>
      <div class="logout" onclick="doLogout()">退出登录</div>
    </div>

    <div class="balance-card">
      <div class="label">可用余额</div>
      <div class="val" id="balanceText">$0.00</div>
    </div>

    <div class="panel">
      <h2>搜索用户</h2>
      <div class="field">
        <input id="searchInput" placeholder="输入Cash ID" />
      </div>
      <button onclick="searchUser()">搜索</button>
      <div id="searchResult"></div>
    </div>

    <div class="panel">
      <h2>转账付款</h2>
      <div class="field">
        <input id="payTarget" placeholder="收款方Cash ID">
      </div>
      <div class="field">
        <input id="payAmount" type="number" placeholder="转账金额">
      </div>
      <div class="field">
        <input id="payRemark" placeholder="备注（选填）">
      </div>
      <button onclick="sendPay()">确认转账</button>
      <div class="msg" id="payMsg"></div>
    </div>

    <div class="panel">
      <h2>交易流水</h2>
      <div class="list-wrap" id="recordWrap"></div>
    </div>
  </div>
</div>

<script>
const API = "/api";
let uid = null;
let clientId = null;

window.onload = async function(){
  uid = localStorage.getItem("loginUid");
  clientId = localStorage.getItem("clientId");
  if(!uid||!clientId){
    goLogin();
    return;
  }
  await autoCheckLogin();
};

async function autoCheckLogin(){
  try{
    const kickRes = await fetch(API+"/user/check-kick",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({uid,clientId})
    });
    const kickData = await kickRes.json();
    if(kickData.kicked){
      clearLocalAuth();
      goLogin();
      return;
    }

    const infoRes = await fetch(API+"/user/info",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({uid,clientId})
    });
    const infoData = await infoRes.json();
    if(!infoData.ok){
      clearLocalAuth();
      goLogin();
      return;
    }
    renderUserInfo(infoData.user);
    document.getElementById("loadingView").style.display="none";
    document.getElementById("mainView").style.display="block";
    loadRecords();
  }catch(e){
    clearLocalAuth();
    goLogin();
  }
}

function renderUserInfo(u){
  document.getElementById("balanceText").textContent = "$"+Number(u.balance).toLocaleString("en-US");
}

function clearLocalAuth(){
  localStorage.removeItem("loginUid");
  localStorage.removeItem("clientId");
}

function goLogin(){
  window.location.href="/";
}

function doLogout(){
  clearLocalAuth();
  goLogin();
}

async function searchUser(){
  const keyword = document.getElementById("searchInput").value.trim();
  const resWrap = document.getElementById("searchResult");
  resWrap.innerHTML="";
  if(!keyword)return;
  try{
    const res = await fetch(API+"/user/lookup/"+encodeURIComponent(keyword));
    const data = await res.json();
    if(!data.ok){
      resWrap.innerHTML='<div class="msg err">未找到用户</div>';
      return;
    }
    const u = data.user;
    let avatarHtml = "";
    if(u.avatar){
      avatarHtml = `<div class="avatar"><img src="${u.avatar}" onerror="this.parentNode.innerHTML='${(u.uid||'').charAt(0).toUpperCase()}'"></div>`;
    }else{
      avatarHtml = `<div class="avatar">${(u.uid||'').charAt(0).toUpperCase()}</div>`;
    }
    resWrap.innerHTML = `
      <div class="user-item">
        ${avatarHtml}
        <div class="info">
          <div class="name">${u.nickname||u.uid}</div>
          <div class="id">@${u.uid}</div>
        </div>
      </div>
    `;
    document.getElementById("payTarget").value = u.uid;
  }catch(e){
    resWrap.innerHTML='<div class="msg err">搜索失败</div>';
  }
}

async function sendPay(){
  const targetUid = document.getElementById("payTarget").value.trim();
  const amount = document.getElementById("payAmount").value.trim();
  const remark = document.getElementById("payRemark").value.trim();
  const msgBox = document.getElementById("payMsg");
  msgBox.className="msg";
  msgBox.innerText="";
  if(!targetUid||!amount){
    msgBox.className="msg err";
    msgBox.innerText="收款ID和金额必填";
    return;
  }
  try{
    const res = await fetch(API+"/user/pay",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({uid,clientId,amount,remark,targetUid})
    });
    const data = await res.json();
    if(!data.ok){
      msgBox.className="msg err";
      msgBox.innerText=data.msg;
      return;
    }
    msgBox.className="msg ok";
    msgBox.innerText="转账成功";
    document.getElementById("payAmount").value="";
    document.getElementById("payRemark").value="";
    renderUserInfo({balance:data.balance});
    loadRecords();
  }catch(e){
    msgBox.className="msg err";
    msgBox.innerText="转账网络异常";
  }
}

async function loadRecords(){
  const wrap = document.getElementById("recordWrap");
  try{
    const res = await fetch(API+"/user/records/"+encodeURIComponent(uid));
    const data = await res.json();
    const list = data.list||[];
    if(list.length===0){
      wrap.innerHTML='<div class="msg">暂无交易记录</div>';
      return;
    }
    let html="";
    list.forEach(r=>{
      html += `
      <div class="record-row">
        <div>${r.time}</div>
        <div>金额：$${Number(r.amount).toLocaleString("en-US")}｜备注：${r.remark||"-"}</div>
      </div>
      `;
    });
    wrap.innerHTML = html;
  }catch(e){
    wrap.innerHTML='<div class="msg err">读取流水失败</div>';
  }
}
</script>
</body>
</html>
