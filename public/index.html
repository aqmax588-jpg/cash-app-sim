
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#00D54B" />
<title>Cash App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
html,body{height:100%;background:#0d0d0d;color:#fff;}
.wrap{max-width:420px;margin:0 auto;padding:40px 20px;height:100%;display:flex;flex-direction:column;justify-content:center;}
.logo{text-align:center;margin-bottom:36px;}
.logo h1{font-size:28px;color:#00d54b;}
.panel{background:#171717;border:1px solid #242424;border-radius:16px;padding:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:#aaa;margin-bottom:6px;}
.field input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff;font-size:15px;outline:none;}
.field input::placeholder{color:#555;}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#00d54b;color:#000;font-weight:700;font-size:15px;cursor:pointer;}
.btn:active{background:#00b840;}
.msg{margin-top:14px;font-size:13px;text-align:center;min-height:20px;}
.msg.err{color:#ff6b6b;}
.msg.ok{color:#00d54b;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <h1>Cash App</h1>
  </div>
  <div class="panel">
    <div class="field">
      <label>Cash ID</label>
      <input id="uidInput" placeholder="输入你的 Cash ID" autocomplete="off" />
    </div>
    <div class="field">
      <label>Password</label>
      <input id="pwdInput" type="password" placeholder="输入密码" autocomplete="new-password" />
    </div>
    <button class="btn" onclick="doLogin()">登录</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>
<script>
const API="/api";
let clientId = localStorage.getItem("clientId") || ("cli_"+Date.now()+"_"+Math.random().toString(36));
localStorage.setItem("clientId",clientId);

async function doLogin(){
  const uid = document.getElementById("uidInput").value.trim();
  const pwd = document.getElementById("pwdInput").value.trim();
  const msgBox = document.getElementById("loginMsg");
  msgBox.className="msg";
  msgBox.innerText="";
  if(!uid||!pwd){
    msgBox.className="msg err";
    msgBox.innerText="请填写账号和密码";
    return;
  }
  try{
    const res = await fetch(API+"/user/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({uid,password:pwd,clientId})
    });
    const data = await res.json();
    if(!data.ok){
      msgBox.className="msg err";
      msgBox.innerText=data.msg;
      return;
    }
    localStorage.setItem("loginUid",uid);
    localStorage.setItem("clientId",clientId);
    window.location.href="/cash.html";
  }catch(e){
    msgBox.className="msg err";
    msgBox.innerText="网络异常，请重试";
  }
}
</script>
</body>
</html>
