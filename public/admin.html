<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <style>
    * {box-sizing:border-box;margin:0;padding:0;font-family:system-ui;}
    body {background:#111;color:#fff;padding:20px;}
    .card {background:#222;padding:16px;border-radius:14px;margin-bottom:16px;max-width:420px;}
    input {width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;}
    button {padding:12px 16px;border:none;border-radius:8px;background:#00a862;color:white;cursor:pointer;margin:4px;}
  </style>
</head>
<body>
  <h2>Admin</h2>
  <div class="card">
    <h3>Add New Account</h3>
    <input id="newUid" placeholder="Account ID">
    <input id="newPwd" placeholder="Password">
    <input id="newNick" placeholder="Nickname">
    <button id="addUserBtn">Create Account (Random Balance 1.5M~2M)</button>
  </div>
  <div class="card">
    <h3>Recharge Account</h3>
    <input id="rechargeUid" placeholder="Target Account ID">
    <input id="rechargeAmt" placeholder="Add Amount USD">
    <button id="rechargeBtn">Recharge</button>
  </div>
  <script>
    const base = "";
    document.getElementById("addUserBtn").onclick = async () => {
      const uid = document.getElementById("newUid").value.trim();
      const pwd = document.getElementById("newPwd").value.trim();
      const nick = document.getElementById("newNick").value.trim();
      const r = await fetch(`${base}/api/admin/add-user`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({uid, pwd, nickname: nick})
      });
      const d = await r.json();
      alert(d.ok ? `Created, balance: ${d.user.balance}` : d.msg);
    }
    document.getElementById("rechargeBtn").onclick = async () => {
      const uid = document.getElementById("rechargeUid").value.trim();
      const amt = Number(document.getElementById("rechargeAmt").value);
      const r = await fetch(`${base}/api/admin/recharge`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({uid, addAmount: amt})
      });
      const d = await r.json();
      alert(d.ok ? `New balance: ${d.newBalance}` : d.msg);
    }
  </script>
</body>
</html>
