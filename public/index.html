<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {box-sizing: border-box;margin:0;padding:0;font-family: system-ui, sans-serif;}
    body {background: #222;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
    .box {width:100%;max-width:360px;}
    h2 {margin-bottom:24px;text-align:center;}
    input {width:100%;padding:14px 16px;margin:8px 0;border-radius:12px;border:none;font-size:16px;}
    button {width:100%;padding:14px;border:none;border-radius:12px;background:#00a862;color:#fff;font-size:17px;margin-top:12px;cursor:pointer;}
    .tip {margin-top:16px;color:#ff7777;text-align:center;display:none;}
  </style>
</head>
<body>
  <div class="box">
    <h2>Sign In</h2>
    <input id="uid" placeholder="Account ID" value="demo001">
    <input id="pwd" type="password" placeholder="Password" value="123456">
    <button id="loginBtn">Login</button>
    <div class="tip" id="tip"></div>
  </div>
  <script>
    const base = "";
    const tip = document.getElementById("tip");
    document.getElementById("loginBtn").onclick = async () => {
      const uid = document.getElementById("uid").value.trim();
      const pwd = document.getElementById("pwd").value.trim();
      const res = await fetch(`${base}/api/login`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({uid, pwd})
      });
      const data = await res.json();
      if (data.ok) {
        localStorage.setItem("sid", data.sessionId);
        localStorage.setItem("uid", data.user.id);
        window.location.href = "/app.html";
      } else {
        tip.innerText = data.msg;
        tip.style.display = "block";
      }
    }
  </script>
</body>
</html>
