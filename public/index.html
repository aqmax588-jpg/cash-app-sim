<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
body{background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}
.box{width:90%;max-width:360px}
h2{text-align:center;margin-bottom:24px}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:none;font-size:16px;background:#222;color:#fff}
button{width:100%;padding:14px;margin-top:12px;background:#00d54b;color:#000;border:none;border-radius:12px;font-weight:bold;font-size:16px}
.msg{margin-top:12px;text-align:center;color:#ff6b6b}
</style>
</head>
<body>
<div class="box">
  <h2>User Login</h2>
  <input id="uid" placeholder="User ID">
  <input id="pwd" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div class="msg" id="msg"></div>
</div>
<script>
const clientId = Math.random().toString(36).slice(2);
async function login(){
  const uid = document.getElementById("uid").value.trim();
  const pwd = document.getElementById("pwd").value.trim();
  const msgBox = document.getElementById("msg");
  const res = await fetch("/api/user/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({uid, password:pwd, clientId})
  });
  const data = await res.json();
  if(data.ok){
    localStorage.setItem("uid", uid);
    localStorage.setItem("clientId", clientId);
    localStorage.setItem("userInfo", JSON.stringify(data.user));
    location.href = "/cash";
  }else{
    msgBox.innerText = data.msg;
  }
}
</script>
</body>
</html>
