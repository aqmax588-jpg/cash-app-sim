<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light">
  <title>Cash App Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- 独立顶部通知条，生命周期独立 -->
    <div id="topNotification" class="top-notification">
      <div class="notify-icon">$</div>
      <div class="notify-content">
        <div class="notify-title">Cash App</div>
        <div class="notify-text">You paid rose $9,999.</div>
      </div>
      <div class="notify-now">now</div>
    </div>

    <div id="pageWrap" class="page-wrap"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
