<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Cash App 管理后台</title>
<style>
html {
  background: #0d0d0d;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
}
body {
  background: #0d0d0d;
  color: #fff;
  padding: 18px;
  min-height: 100vh;
}
.wrap {
  max-width: 1100px;
  margin: 0 auto;
}
h1 {
  font-size: 20px;
  margin-bottom: 4px;
}
.desc {
  color: #8a8a8e;
  font-size: 13px;
  margin-bottom: 18px;
}
.panel {
  background: #171717;
  border: 1px solid #242424;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.panel h2 {
  font-size: 15px;
  margin-bottom: 12px;
  color: #e6e6e6;
}
.field {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.field input, .field select {
  padding: 11px 13px;
  border-radius: 9px;
  border: 1px solid #2a2a2a;
  background: #0f0f0f;
  color: #fff;
  font-size: 14px;
  outline: none;
  min-width: 150px;
  flex: 1 1 150px;
}
.field input::placeholder {
  color: #555;
}
button {
  padding: 11px 16px;
  border: none;
  border-radius: 9px;
  background: #00d54b;
  color: #000;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
button:active {
  background: #00b840;
}
button.gray {
  background: #2a2a2a;
  color: #ddd;
}
button.red {
  background: #ff453a;
  color: #fff;
}
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.tab {
  padding: 10px 16px;
  border-radius: 9px;
  background: #1c1c1e;
  color: #aaa;
  border: none;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.tab.active {
  background: #00d54b;
  color: #000;
}
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 10px;
}
th, td {
  border-bottom: 1px solid #242424;
  padding: 10px 8px;
  text-align: left;
  vertical-align: middle;
}
th {
  color: #8a8a8e;
  font-weight: 600;
  font-size: 12px;
}
td.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
button.copy {
  background: #e9f0ff;
  color: #1466ff;
  border: 1px solid #c9dcff;
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 8px;
  cursor: pointer;
}
button.copy:active {
  background: #d8e6ff;
}
.created-card {
  margin-top: 10px;
  padding: 12px 14px;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  background: #171717;
}
.created-line {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  font-size: 13px;
}
.created-line span {
  width: 44px;
  color: #8a8a8e;
  flex: 0 0 auto;
}
.created-line b {
  flex: 1;
  color: #fff;
  font-weight: 600;
  word-break: break-all;
}
td input,td select {
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid #2a2a2a;
  background: #0f0f0f;
  color: #fff;
  font-size: 13px;
  width: 100px;
  outline: none;
}
.mono {
  color: #aaa;
  font-size: 12px;
}
.msg {
  margin-top: 10px;
  font-size: 13px;
  color: #00d54b;
  min-height: 18px;
}
.msg.err {
  color: #ff6b6b;
}
.empty {
  color: #666;
  padding: 24px 0;
  text-align: center;
  font-size: 13px;
}
@media (max-width: 640px) {
  table { font-size: 12px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginView">
    <h1>Cash App 管理后台</h1>
    <div class="desc">管理员登录后可创建用户、充值余额、设置头像、查看流水</div>
    <div class="panel">
      <h2>管理员登录</h2>
      <div class="field">
        <input id="adminUser" placeholder="管理员账号" value="admin">
        <input id="adminPwd" type="password" placeholder="管理员密码">
        <button onclick="adminLogin()">登录后台</button>
      </div>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>
  <div id="mainView" style="display:none;">
    <h1>Cash App 管理后台</h1>
    <div class="desc">当前管理员：admin</div>
    <div class="tabs">
      <button class="tab active" id="tabUserBtn" onclick="switchTab('user')">用户管理</button>
      <button class="tab" id="tabLogBtn" onclick="switchTab('log')">交易流水</button>
    </div>
    <div class="tab-content active" id="userTab">
      <div class="panel">
        <h2>新增用户</h2>
        <div class="field">
          <input id="newUid" placeholder="用户 Cash ID（登录用）">
          <input id="newPwd" placeholder="登录密码">
          <input id="newNick" placeholder="昵称">
          <input id="newCashtag" placeholder="Cash 头像 cashtag（不带$，可留空）">
          <select id="newCardType">
            <option value="day">天卡（1天）</option>
            <option value="month">月卡（30天）</option>
            <option value="quarter">季卡（90天）</option>
            <option value="year">年卡（365天）</option>
            <option value="permanent">永久卡</option>
          </select>
          <button onclick="addUser()">创建账号</button>
        </div>
        <div class="msg" id="addMsg"></div>
        <div class="desc" style="margin:10px 0 0;">新账号余额自动随机 1,500,000 ~ 2,000,000 美元；账号【首次登录】才开始计时生效</div>
      </div>
      <div class="panel">
        <h2>用户列表</h2>
        <div id="userTableWrap" style="overflow-x:auto;-webkit-overflow-scrolling:touch;"><div class="empty">加载中...</div></div>
        <button class="gray" style="margin-top:12px;" onclick="cleanInvalid()">清理历史遗留账号</button>
        <div class="desc" style="margin:8px 0 0;font-size:12px;">只清理没有有效 Cash ID 的旧数据（这类账号本来也无法登录），正常账号不受影响</div>
      </div>
    </div>
    <div class="tab-content" id="logTab">
      <div class="panel">
        <h2>全部交易流水</h2>
        <div id="logTableWrap"><div class="empty">加载中...</div></div>
      </div>
    </div>
  </div>
</div>
<script>
const API = '/api';
let currentTab = 'user';
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('userTab').classList.toggle('active', tab === 'user');
  document.getElementById('logTab').classList.toggle('active', tab === 'log');
  document.getElementById('tabUserBtn').classList.toggle('active', tab === 'user');
  document.getElementById('tabLogBtn').classList.toggle('active', tab === 'log');
  if (tab === 'user') loadUsers();
  else loadLogs();
}
async function adminLogin() {
  const username = document.getElementById('adminUser').value.trim();
  const password = document.getElementById('adminPwd').value.trim();
  const msg = document.getElementById('loginMsg');
  msg.classList.remove('err');
  msg.innerText = '';
  try {
    const res = await fetch(API + '/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!data.ok) {
      msg.classList.add('err');
      msg.innerText = data.msg;
      return;
    }
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display = 'block';
    loadUsers();
  } catch (e) {
    msg.classList.add('err');
    msg.innerText = '网络错误，请重试';
  }
}
async function addUser() {
  const uid = document.getElementById('newUid').value.trim();
  const password = document.getElementById('newPwd').value.trim();
  const nickname = document.getElementById('newNick').value.trim();
  const cashtag = document.getElementById('newCashtag').value.trim();
  const cardType = document.getElementById('newCardType').value;
  const msg = document.getElementById('addMsg');
  msg.classList.remove('err');
  msg.innerText = '';
  if (!uid || !password) {
    msg.classList.add('err');
    msg.innerText = '用户 Cash ID 和密码必填';
    return;
  }
  const avatar = '';
  try {
    const res = await fetch(API + '/admin/add-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid, password, nickname, avatar, cardType })
    });
    const data = await res.json();
    if (!data.ok) {
      msg.classList.add('err');
      msg.innerText = data.msg;
      return;
    }
    showCreated(data.user || { uid: uid, password: password, nickname: nickname, balance: 0 });
    document.getElementById('newUid').value = '';
    document.getElementById('newPwd').value = '';
    document.getElementById('newNick').value = '';
    document.getElementById('newCashtag').value = '';
    loadUsers();
  } catch (e) {
    msg.classList.add('err');
    msg.innerText = '网络错误，请重试';
  }
}
/* ---------- 创建成功后的账号信息卡片 ---------- */
function showCreated(u) {
  var box = document.getElementById('addMsg');
  box.classList.remove('err');
  box.innerHTML =
    '<div>创建成功，账号信息如下</div>' +
    '<div class="created-card">' +
      '<div class="created-line"><span>账号</span><b>' + u.uid + '</b></div>' +
      '<div class="created-line"><span>密码</span><b>' + (u.password || '') + '</b></div>' +
      '<div class="created-line"><span>余额</span><b>$' + Number(u.balance || 0).toLocaleString('en-US') + '</b></div>' +
      '<div class="created-line"><span>一键</span>' +
        '<button class="copy" onclick="copyText(\'账号：' + u.uid + '  密码：' + (u.password || '') + '\')">复制账号密码</button></div>' +
    '</div>';
}
/* ---------- 一键复制 ---------- */
function copyField(i) {
  var u = (window.__users || [])[i];
  if (!u) return;
  var text = '账号：' + u.uid + '  密码：' + (u.password || '');
  copyText(text);
}
function copyText(text) {
  if (fallbackCopy(text)) {
    tip('已复制');
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      tip('已复制');
    }).catch(function () {
      alert('复制失败，请手动记录：' + text);
    });
  } else {
    alert('复制失败，请手动记录：' + text);
  }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.left = '0';
  ta.style.opacity = '0';
  ta.setAttribute('readonly', '');
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function tip(text) {
  var el = document.getElementById('copyTip');
  if (!el) {
    el = document.createElement('div');
    el.id = 'copyTip';
    el.style.cssText = 'position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#00d54b;color:#000;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:opacity .2s;';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(el.__t);
  el.__t = setTimeout(function () { el.style.opacity = '0'; }, 1400);
}

/* 时间格式化：2026-11-12 09:20 */
function fmtDT(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
/* 账号状态：未激活 / 生效中(剩N天) / 已过期 / 永久 */
function cardStatus(u) {
  if (!u.isActivated) return '<span style="color:#8a8a8e;">未激活</span>';
  if (u.cardType === 'permanent') return '<span style="color:#00D54F;">永久</span>';
  if (!u.expireTime) return '<span style="color:#8a8a8e;">未计时</span>';
  const left = new Date(u.expireTime).getTime() - Date.now();
  if (left <= 0) return '<span style="color:#ff453a;">已过期</span>';
  const days = Math.ceil(left / 86400000);
  const hours = Math.ceil(left / 3600000);
  const txt = days >= 1 ? ('剩' + days + '天') : ('剩' + hours + '小时');
  return '<span style="color:#00D54F;">生效中</span><div style="color:#8a8a8e;font-size:11px;">' + txt + '</div>';
}
async function loadUsers() {
  const wrap = document.getElementById('userTableWrap');
  try {
    const res = await fetch(API + '/admin/users');
    const list = await res.json();
    if (list.length === 0) {
      wrap.innerHTML = '<div class="empty">还没有用户，请先在上方创建账号</div>';
      return;
    }
    let html =
      '<table><thead><tr>' +
      '<th>Cash ID</th><th>密码</th><th>余额</th><th>卡种</th><th>状态</th><th>激活时间</th><th>到期时间</th><th>头像 cashtag</th><th>操作</th>' +
      '</tr></thead><tbody>';
    window.__users = list;
    list.forEach(function (u, i) {
      html +=
        '<tr>' +
          '<td>' + u.uid + '<div style="color:#8a8a8e;font-size:11px;margin-top:2px;">创建 ' + fmtDT(u.createdAt) + '</div></td>' +
          '<td>' + (u.password || '') + '</td>' +
          '<td>$' + Number(u.balance).toLocaleString('en-US') + '</td>' +
          '<td><select id="card_'+i+'">'+
              '<option value="day" '+(u.cardType==='day'?'selected':'')+'>天卡</option>'+
              '<option value="month" '+(u.cardType==='month'?'selected':'')+'>月卡</option>'+
              '<option value="quarter" '+(u.cardType==='quarter'?'selected':'')+'>季卡</option>'+
              '<option value="year" '+(u.cardType==='year'?'selected':'')+'>年卡</option>'+
              '<option value="permanent" '+(u.cardType==='permanent'?'selected':'')+'>永久卡</option>'+
          '</select><button class="gray" style="margin-left:4px;" onclick="setCardType(\''+u.uid+'\','+i+')">修改</button></td>'+
          '<td>' + cardStatus(u) + '</td>' +
          '<td>' + fmtDT(u.activateTime) + '</td>' +
          '<td>' + (u.cardType === 'permanent' ? '永久' : fmtDT(u.expireTime)) + '</td>' +
          '<td><input id="tag_' + i + '" placeholder="cashtag"><button class="gray" style="margin-left:6px;" onclick="setAvatar(\'' + u.uid + '\',' + i + ')">设头像</button></td>' +
          '<td class="actions">' +
            '<button class="copy" onclick="copyField(' + i + ')">复制账号密码</button>' +
            '<input type="number" id="bal_' + i + '" value="' + u.balance + '">' +
            '<button onclick="setBalance(\'' + u.uid + '\',' + i + ')">改余额</button>' +
            '<button class="red" onclick="kickUser(\'' + u.uid + '\')">踢下线</button>' +
            '<button class="red" onclick="deleteUser(\'' + u.uid + '\')">删除账号</button>' +
          '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  } catch (e) {
    wrap.innerHTML = '<div class="empty">加载失败，请刷新</div>';
  }
}
/* 清理历史遗留账号：删掉没有有效 Cash ID 的旧数据 */
async function cleanInvalid() {
  if (!confirm('将清理所有没有有效 Cash ID 的历史遗留账号。\n这类账号本来也无法登录，正常账号不受影响。确定清理？')) {
    return;
  }
  try {
    const res = await fetch(API + '/admin/clean-invalid', { method: 'POST' });
    const data = await res.json();
    alert(data.msg || '清理完成');
  } catch (e) {
    alert('清理失败，请检查网络后重试');
  }
  loadUsers();
}
async function setCardType(uid,i){
  const sel = document.getElementById("card_"+i);
  const cardType = sel.value;
  await fetch(API+'/admin/set-cardtype',{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({uid,cardType})
  })
  alert("卡种已更新");
  loadUsers();
}
async function setBalance(uid, i) {
  const val = document.getElementById('bal_' + i).value;
  await fetch(API + '/admin/set-balance', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid: uid, newBalance: val })
  });
  loadUsers();
}
async function setAvatar(uid, i) {
  const tag = document.getElementById('tag_' + i).value.trim();
  if (!tag) {
    alert('请先填写 cashtag（不带 $）');
    return;
  }
  const res = await fetch(API + '/admin/set-avatar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid: uid, cashtag: tag })
  });
  const data = await res.json();
  alert(data.msg);
  loadUsers();
}
async function kickUser(uid) {
  await fetch(API + '/admin/kick', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid: uid })
  });
  alert('已踢下线');
}
/* 删除账号：二次确认，删除后清掉会话与搜索历史，交易流水保留 */
async function deleteUser(uid) {
  if (!confirm('确定删除账号 ' + uid + ' ？\n删除后该账号无法登录，其会话和搜索历史一并清除，交易流水保留。')) {
    return;
  }
  try {
    const res = await fetch(API + '/admin/delete-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: uid })
    });
    const data = await res.json();
    alert(data.msg || '操作失败');
  } catch (e) {
    alert('删除失败，请检查网络后重试');
  }
  loadUsers();
}
async function loadLogs() {
  const wrap = document.getElementById('logTableWrap');
  try {
    const res = await fetch(API + '/admin/logs');
    const data = await res.json();
    const list = data.list || [];
    if (list.length === 0) {
      wrap.innerHTML = '<div class="empty">暂无交易流水</div>';
      return;
    }
    let html =
      '<table><thead><tr>' +
      '<th>时间</th><th>付款人</th><th>收款人</th><th>金额</th><th>备注</th><th>交易号</th>' +
      '</tr></thead><tbody>';
    list.forEach(function (r) {
      html +=
        '<tr>' +
          '<td class="mono">' + r.time + '</td>' +
          '<td>' + (r.nickname || r.uid) + '</td>' +
          '<td>' + r.targetNick + '</td>' +
          '<td>$' + Number(r.amount).toLocaleString('en-US') + '</td>' +
          '<td>' + (r.remark || '-') + '</td>' +
          '<td class="mono">' + r.recordId + '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  } catch (e) {
    wrap.innerHTML = '<div class="empty">加载失败，请刷新</div>';
  }
}
</script>
</body>
</html>
